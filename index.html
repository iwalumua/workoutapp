<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groundwork — Daily Training Plan</title>
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#eef0ec; --surface:#ffffff; --surface-2:#f6f7f4; --line:#dfe3dc;
  --ink:#181d1a; --muted:#5c665f; --faint:#8b958d;
  --accent:#127c71; --accent-strong:#0c5a52; --accent-soft:#d7ece8;
  --amber:#c9791f; --amber-soft:#f6e6d2;
  --good:#2f9e6b; --good-soft:#dcefe4; --warn:#c9791f; --crit:#c8483d; --crit-soft:#f7ddd8;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.06);
  --r:14px; --r-sm:9px;
  --dsp:"Archivo",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#10130f; --surface:#181d18; --surface-2:#1f251f; --line:#2c332b;
    --ink:#e9efe8; --muted:#a3ada4; --faint:#727c73;
    --accent:#3ec4b1; --accent-strong:#63d4c3; --accent-soft:#123a35;
    --amber:#e0a24e; --amber-soft:#3a2c15;
    --good:#4cc489; --good-soft:#14372a; --warn:#e0a24e; --crit:#e2695b; --crit-soft:#3a1d19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#10130f; --surface:#181d18; --surface-2:#1f251f; --line:#2c332b;
  --ink:#e9efe8; --muted:#a3ada4; --faint:#727c73;
  --accent:#3ec4b1; --accent-strong:#63d4c3; --accent-soft:#123a35;
  --amber:#e0a24e; --amber-soft:#3a2c15;
  --good:#4cc489; --good-soft:#14372a; --warn:#e0a24e; --crit:#e2695b; --crit-soft:#3a1d19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--dsp);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--accent-strong)}

/* header */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.hbar{max-width:920px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));
  display:grid;place-items:center;color:#fff;flex:none;box-shadow:var(--shadow)}
.logo svg{width:17px;height:17px}
.brand b{font-family:var(--dsp);font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand .tag{font-size:11px;color:var(--muted);margin-top:-2px}
.hbtn{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
  width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.hbtn:hover{color:var(--ink)}
.syncchip{margin-left:auto;flex:none;font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;cursor:default}
.syncchip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.syncchip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.syncchip.err{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.syncchip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85;flex:none}
.syncchip.spinning::before{border:2px solid currentColor;border-top-color:transparent;background:none;width:9px;height:9px;animation:sp .8s linear infinite}
nav.tabs{max-width:920px;margin:0 auto;padding:6px 8px 0;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{
  flex:none;border:0;background:none;color:var(--muted);cursor:pointer;
  padding:10px 12px;font-size:13.5px;font-weight:600;border-bottom:2.5px solid transparent;white-space:nowrap;
}
nav.tabs button[aria-current="true"]{color:var(--ink);border-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}

main{max-width:920px;margin:0 auto;padding:16px;padding-block:18px 64px}
.view{display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.sechead h2{font-size:19px}
.sechead .sub{color:var(--muted);font-size:12.5px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-strong)}

/* today hero */
.dayhero{padding:16px;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(150deg,var(--accent-soft),var(--surface) 62%);border-color:transparent}
.dayhero .row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.daytype{font-family:var(--dsp);font-weight:800;font-size:24px;letter-spacing:-.02em}
.daymeta{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong)}
.pill.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.progline{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progline i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-strong))}

.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r-sm);padding:11px 13px;font-size:13px;color:var(--muted)}
.note.phys{border-left-color:var(--amber)}
.note b{color:var(--ink)}

/* block */
.block{display:flex;flex-direction:column;gap:9px}
.blocklabel{display:flex;align-items:center;gap:8px;margin:4px 2px 2px}
.blocklabel h3{font-size:13.5px;letter-spacing:.02em}
.blocklabel .n{font-size:11px;color:var(--faint);font-weight:600}
.blocklabel .dot{width:7px;height:7px;border-radius:2px;background:var(--accent);flex:none}
.dot.rehab{background:var(--amber)} .dot.core{background:#7a68c9} .dot.cardio{background:var(--good)} .dot.warm{background:var(--faint)}

.ex{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);overflow:hidden}
.ex.done{border-color:var(--good);background:var(--good-soft)}
.ex-top{display:flex;align-items:center;gap:10px;padding:11px 12px}
.ex-check{flex:none;width:24px;height:24px;border-radius:7px;border:1.8px solid var(--line);background:var(--surface-2);
  cursor:pointer;display:grid;place-items:center;color:transparent;transition:.12s}
.ex.done .ex-check{background:var(--good);border-color:var(--good);color:#fff}
.ex-name{flex:1;min-width:0}
.ex-name b{font-size:14.5px;font-weight:600;display:block}
.ex-scheme{font-size:12px;color:var(--muted);margin-top:1px}
.ex-scheme .mono{color:var(--ink);font-weight:600}
.iBtn{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent-strong);
  background:var(--surface);cursor:pointer;font-family:var(--dsp);font-weight:800;font-size:13px;line-height:1}
.iBtn:hover{background:var(--accent-soft)}
.muscles{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 10px 46px}
.mtag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong)}
.mtag.sec{background:var(--surface-2);color:var(--muted)}
.log{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px 46px;align-items:flex-end}
.fieldlet{display:flex;flex-direction:column;gap:3px}
.fieldlet label{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.fieldlet input,.fieldlet select{width:74px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.fieldlet.feel select{width:118px}
.fieldlet input:focus,.fieldlet select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.painflag{font-size:11px;color:var(--crit);font-weight:600;display:flex;align-items:center;gap:5px;width:100%;margin-top:-2px}

.btn{border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;font-family:var(--dsp);
  letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.tile .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--dsp);font-weight:800;font-size:26px;margin-top:3px;letter-spacing:-.02em}
.tile .v small{font-size:14px;font-weight:600;color:var(--muted)}
.tile .d{font-size:11.5px;color:var(--faint);margin-top:2px}
.bmiscale{margin-top:9px;height:7px;border-radius:999px;position:relative;
  background:linear-gradient(90deg,#5aa9e6 0 14%,var(--good) 14% 42%,var(--amber) 42% 70%,var(--crit) 70%)}
.bmiscale i{position:absolute;top:-4px;width:3px;height:15px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}

/* progress */
.mg{display:flex;flex-direction:column;gap:6px;padding:13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.mg .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mg .name{font-weight:600;font-size:13.5px}
.mg .best{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--accent-strong)}
.mg .vol{font-size:11px;color:var(--faint)}
.spark{width:100%;height:34px;display:block}
.mggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

/* history */
.hitem{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);overflow:hidden}
.hitem summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px}
.hitem summary::-webkit-details-marker{display:none}
.hitem .hd{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.hitem .ht{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.hitem .hv{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.hbody{padding:0 14px 12px;border-top:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
.hrow:last-child{border:0}
.hrow .rn{color:var(--ink)} .hrow .rv{font-family:var(--mono);color:var(--muted)}

/* settings */
.frow{display:flex;flex-direction:column;gap:5px}
.frow label{font-size:12px;font-weight:600;color:var(--muted)}
.frow input,.frow select,.frow textarea{padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);width:100%}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}
.loadlist{display:flex;flex-wrap:wrap;gap:7px}
.loadchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:5px 6px 5px 12px;font-family:var(--mono);font-size:12.5px;font-weight:600}
.loadchip button{border:0;background:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;padding:0 3px}
.loadchip button:hover{color:var(--crit)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,20,17,.55);z-index:60;display:none;
  align-items:flex-end;justify-content:center;padding:0}
.overlay.on{display:flex}
@media(min-width:640px){.overlay{align-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow:auto;
  border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.3)}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:16px 18px;display:flex;align-items:flex-start;gap:10px;z-index:2}
.sheet-h h3{font-size:18px}
.sheet-h .cat{font-size:11.5px;color:var(--accent-strong);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sheet-h .x{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface-2);width:32px;height:32px;
  border-radius:8px;cursor:pointer;color:var(--muted);font-size:18px}
.sheet-b{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.infoblock h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;
  display:flex;align-items:center;gap:7px}
.infoblock ol,.infoblock ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.infoblock p{margin:0;font-size:13.5px}
.feelbox{background:var(--accent-soft);border-radius:var(--r-sm);padding:11px 13px;font-size:13px;color:var(--accent-strong)}
.warnbox{background:var(--crit-soft);border-radius:var(--r-sm);padding:11px 13px;font-size:13px;color:var(--ink);border-left:3px solid var(--crit)}
.muscleicons{display:flex;flex-wrap:wrap;gap:6px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;
  z-index:90;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;max-width:90%}
#toast.on{opacity:1}

.empty{text-align:center;color:var(--muted);padding:26px 16px;font-size:13.5px}
.hr{height:1px;background:var(--line);border:0;margin:2px 0}
.mini{font-size:11.5px;color:var(--faint)}
.center{display:flex;align-items:center;gap:8px}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition:none!important}}
</style>

<header>
  <div class="hbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>
      <div><b>Groundwork</b><div class="tag" id="brandtag">Knee-smart daily training</div></div>
    </div>
    <span class="syncchip" id="syncchip" title="Where your workout data is saved">On this device</span>
    <button class="hbtn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19" stroke-linecap="round"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main><div class="view" id="view"></div></main>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------------------------------------------------------------------------
   Groundwork — knee-smart, dumbbell-only daily training planner
   Built for: 37M, 175cm, dumbbells + adjustable bench, 4 days/week, 60 min.
   Constraints honored: patellar-tendon knee rehab + ankle strengthening.
--------------------------------------------------------------------------- */

/* ============ tiny helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...kids)=>{const n=document.createElement(t);
  for(const k in a){ if(k==="class")n.className=a[k]; else if(k==="html")n.innerHTML=a[k];
    else if(k.startsWith("on")&&typeof a[k]==="function")n.addEventListener(k.slice(2),a[k]);
    else if(a[k]!=null&&a[k]!==false)n.setAttribute(k,a[k]); }
  for(const c of kids.flat()){ if(c==null||c===false)continue; n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;};
const todayStr=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10);};
const fmtDate=s=>{const d=new Date(s+"T00:00:00");return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let toastT;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2600);};

/* ============ capability wiring (works with OR without claude.ai runtime) ============ */
const CLAUDE=(typeof window!=="undefined")?window.claude:null;
async function cap(name){ try{ return CLAUDE&&CLAUDE.use? await CLAUDE.use(name):null; }catch(e){ return null; } }

/* ============ muscle groups ============ */
const MG={ chest:"Chest", back:"Back", shoulders:"Shoulders", biceps:"Biceps", triceps:"Triceps",
  quads:"Quads", hamstrings:"Hamstrings", glutes:"Glutes", calves:"Calves",
  core:"Core", ankles:"Ankles", knees:"Knee (rehab)" };

/* ============ EXERCISE LIBRARY (the info button reads from here) ============ */
/* cat: warm | push | pull | lower | knee | ankle | core | cardio  */
const EX={
/* ---- warm-up / mobility ---- */
wu_arm:{name:"Arm circles + shoulder rolls",cat:"warm",equip:"none",kneeSafe:true,primary:["shoulders"],secondary:[],
  form:"Stand tall, arms out to the sides, make slow controlled circles.",
  steps:["Extend both arms straight out to your sides.","Draw small circles forward for 15s, then backward for 15s.","Finish with 10 slow shoulder rolls back."],
  feel:"A light warmth around the shoulders and upper back — this wakes up the joint, it should never pinch.",
  wrong:"If you feel a sharp pinch at the top of the shoulder, make the circles smaller and slower.",
  precautions:["Keep it gentle — this is a warm-up, not a stretch to force."]},
wu_catcow:{name:"Cat–cow",cat:"warm",equip:"none",kneeSafe:true,primary:["core","back"],secondary:[],
  form:"On hands and knees (pad under the knees), stack hands under shoulders, knees under hips.",
  steps:["Inhale: drop the belly, lift the chest and tailbone (cow).","Exhale: round the spine, tuck the chin and tailbone (cat).","Move slowly with your breath for 8–10 rounds."],
  feel:"A gentle mobilising stretch flowing along the whole spine.",
  wrong:"If your knees hurt kneeling, kneel on a folded towel or do it seated on a chair.",
  precautions:["Move through a comfortable range — no forcing at the ends."]},
wu_hip:{name:"Hip openers (standing)",cat:"warm",equip:"none",kneeSafe:true,primary:["glutes","hamstrings"],secondary:["core"],
  form:"Hold a wall for balance; lift one knee and open it out to the side, then back.",
  steps:["Hold a wall or bench with one hand.","Lift one knee to hip height, rotate it outward, then back to front. 8 per side.","Then do 8 gentle leg swings front-to-back per side."],
  feel:"Loosening around the hips and glutes.",
  wrong:"Keep the swinging leg relaxed — if the standing knee complains, reduce the range.",
  precautions:["Do NOT force the knee out; keep movements small and controlled."]},
wu_ankle:{name:"Ankle circles + rockers",cat:"warm",equip:"none",kneeSafe:true,primary:["ankles"],secondary:["calves"],
  form:"Seated or standing with support, circle the ankle then rock heel-to-toe.",

/* ============ cross-device cloud sync (artifact `db` capability) ============ */
let DB=null, UID=null, dbDoc=null, dbUnsub=null, cloudTimer=null, applyingRemote=false;
let SYNC="init"; // init | off | connecting | synced | error
function updateSyncUI(){
  const c=document.getElementById("syncchip"); if(!c)return;
  c.classList.remove("ok","warn","err","spinning");
  const set=(txt,cls,title)=>{c.textContent=txt;if(cls)c.classList.add(cls);c.title=title;};
  if(SYNC==="off")set("On this device","","Saved privately in this browser only. Use Download CSV to back up or move devices.");
  else if(SYNC==="connecting"){set("Syncing…","",""),c.classList.add("spinning");}
  else if(SYNC==="synced")set("Synced","ok","Synced to your Claude account — open this link on any device signed in as you.");
  else if(SYNC==="error")set("Sync paused","warn","Couldn't reach the cloud store right now; your data is safe on this device and will retry.");
  else set("On this device","","");
}
function scheduleCloud(){ if(!dbDoc)return; SYNC="connecting"; updateSyncUI();
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{ pushCloud().then(()=>{SYNC="synced";updateSyncUI();}).catch(()=>{SYNC="error";updateSyncUI();}); },900);
}
function pushCloud(){ if(!dbDoc)return Promise.resolve();
  return dbDoc.set({payload:JSON.stringify(S), updatedAt:S.updatedAt||Date.now(), v:3}); }
function adoptRemote(remote){
  try{ const obj=JSON.parse(remote.payload); if(!obj||!obj.profile)return false;
    applyingRemote=true; S=Object.assign(freshState(),obj); S.updatedAt=remote.updatedAt||S.updatedAt;
    save({cloud:false,bump:false}); applyingRemote=false; render(); return true;
  }catch(e){ applyingRemote=false; return false; }
}
async function initSync(){
  const dbc=await cap("db");
  if(!dbc){ SYNC="off"; updateSyncUI(); return; }
  DB=dbc;
  const usr=await cap("user");
  try{ UID=usr? await usr.id() : null; }catch(e){ UID=null; }
  if(!UID){ SYNC="off"; updateSyncUI(); return; }   // no private space for this viewer → stay local
  SYNC="connecting"; updateSyncUI();
  try{
    dbDoc=DB.doc("data/users/"+UID+"/state");
    const snap=await dbDoc.get();
    if(snap.exists){
      const remote=snap.data();
      if((remote.updatedAt||0) > (S.updatedAt||0)) adoptRemote(remote);
      else if((S.updatedAt||0) > (remote.updatedAt||0)) await pushCloud();
    } else if((S.updatedAt||0) > 0){
      await pushCloud();  // first sync of an already-used device
    }
    SYNC="synced"; updateSyncUI();
    dbUnsub=dbDoc.onSnapshot(sn=>{
      if(!sn.exists)return;
      if(sn.metadata && sn.metadata.hasPendingWrites)return; // our own unconfirmed write
      const remote=sn.data();
      if((remote.updatedAt||0) > (S.updatedAt||0) && adoptRemote(remote)) toast("Updated from your other device ✓");
    }, ()=>{ SYNC="error"; updateSyncUI(); });
  }catch(e){ SYNC="error"; updateSyncUI(); }
}

/* ============ progression helpers ============ */
function loadsSorted(){ // to kg for comparison
  const toKg=l=>l.u==="lb"?l.v*0.4536:l.v;
  return [...S.equipment.loads].sort((a,b)=>toKg(a)-toKg(b));
}
function loadLabel(exId){
  const w=curWeight(exId);
  if(w===0||w==null)return "Bodyweight";
  const l=S.equipment.loads.find(x=>x.v===w)||S.equipment.loads[0];
  return w+" "+(l?l.u:"lb");
}
function curWeight(exId){
  if(S.progress[exId]&&S.progress[exId].weight!=null)return S.progress[exId].weight;
  // snap starter to nearest available load value
  const start=starterWeight(exId);
  if(start===0)return 0;
  const vals=S.equipment.loads.map(l=>l.v);
  let best=vals[0]; for(const v of vals) if(Math.abs(v-start)<Math.abs(best-start))best=v;
  return best;
}
function nextLoadUp(exId){
  const w=curWeight(exId); const vals=[...new Set(S.equipment.loads.map(l=>l.v))].sort((a,b)=>a-b);
  const nx=vals.find(v=>v>w); return nx!=null?nx:w;
}
function setWeight(exId,w){ (S.progress[exId]=S.progress[exId]||{}).weight=w; }

/* ============ plan generation ============ */
function isTrainingDay(dateStr){
  const dow=new Date(dateStr+"T00:00:00").getDay(); // 0 Sun .. 6 Sat
  const n=S.profile.daysPerWeek;
  const sets={3:[1,3,5],4:[1,2,4,5],5:[1,2,3,4,5],6:[1,2,3,4,5,6]};
  return (sets[n]||sets[4]).includes(dow);
}
function buildPlan(dateStr,splitIndex){
  const tmpl = splitIndex==null?RECOVERY:SPLIT[splitIndex%4];
  const blocks=tmpl.blocks.map(b=>({label:b.label,kind:b.kind,items:b.items.map(([exId,sets,reps])=>{
    const w=curWeight(exId);
    return {exId,sets,reps,weight:w,done:false,
      log:{weightUsed:(w||""),repsDone:"",feel:"",pain:false,notes:""}};
  })}));
  return {date:dateStr,dayKey:tmpl.key,name:tmpl.name,focus:tmpl.focus,isRecovery:splitIndex==null,
    blocks,submitted:false,coachNote:"",aiUsed:false};
}
function ensurePlan(){
  const t=todayStr();
  if(S.plan&&S.plan.date===t)return;
  // if there is a prepared tomorrow matching today, use it
  if(S.tomorrow&&S.tomorrow.date===t){ S.plan=S.tomorrow; S.tomorrow=null; save(); return; }
  // was the previous plan a training day that never got submitted? repeat it (don't skip a workout)
  let splitIdx;
  if(isTrainingDay(t)){
    if(S.plan&&!S.plan.submitted&&!S.plan.isRecovery){
      // keep the same split index -> repeat missed session
      splitIdx=(S.cycle-1+4)%4;
      S.plan=buildPlan(t,splitIdx);
      S.plan.coachNote="Repeating your last session — you didn't log the previous one, so nothing was skipped. When you submit, tomorrow adapts.";
      save();return;
    }
    splitIdx=S.cycle%4;
  }else{
    splitIdx=null; // recovery
  }
  S.plan=buildPlan(t,splitIdx);
  save();
}

/* ============ health calcs ============ */
function health(){
  const h=S.profile.heightCm/100, w=S.profile.weightKg, t=S.profile.targetKg;
  const bmi=w/(h*h);
  const lo=18.5*h*h, hi=24.9*h*h, ideal=22.5*h*h;
  let cat="Healthy",catClass="good";
  if(bmi<18.5){cat="Underweight";catClass="warn";}
  else if(bmi<25){cat="Healthy";catClass="good";}
  else if(bmi<30){cat="Overweight";catClass="warn";}
  else{cat="Obese";catClass="crit";}
  const start=(S.weightLog[0]&&S.weightLog[0].kg)||w;
  const lost=Math.max(0,start-w), toGo=Math.max(0,w-t), totalGoal=Math.max(0.1,start-t);
  const pct=clamp(lost/totalGoal*100,0,100);
  return {bmi,lo,hi,ideal,cat,catClass,start,lost,toGo,pct,pos:clamp((bmi-15)/(35-15)*100,2,98)};
}

/* ============ analysis (rules + optional Claude) ============ */
function ruleAnalyze(plan){
  // returns {note, adjustments:{exId:'up'|'keep'|'down'|'swap'}, painFlags:[]}
  const adj={}, painEx=[]; let easy=0,hard=0,logged=0;
  plan.blocks.forEach(b=>b.items.forEach(it=>{
    const f=it.log.feel; if(it.log.pain)painEx.push(EX[it.exId].name);
    if(f){logged++;}
    if(it.log.pain){adj[it.exId]="swap";return;}
    if(f==="easy"){adj[it.exId]="up";easy++;}
    else if(f==="hard"||f==="failed"){adj[it.exId]="down";hard++;}
    else if(f==="good"){adj[it.exId]="keep";}
  }));
  let note;
  if(logged===0){note="No effort logged today. Tomorrow's plan stays the same so you can pick it back up.";}
  else if(painEx.length){note="You flagged discomfort on "+painEx.join(", ")+". I've swapped or lightened those and kept everything knee-safe — mention this to your physio if it persists.";}
  else if(easy>hard){note="Strong session — several lifts felt easy, so I nudged those up a notch for tomorrow. Progressive overload in action.";}
  else if(hard>easy){note="That was a grind today. I eased the toughest lifts slightly so tomorrow's quality stays high. Recovery is part of progress.";}
  else{note="Solid, dialled-in session. I kept the loads and added small rep targets where it made sense. Consistency is winning here.";}
  return {note,adjustments:adj,painFlags:painEx};
}
function applyAdjustments(adj){
  for(const exId in adj){
    const a=adj[exId], w=curWeight(exId);
    if(a==="up"){ if(w>0)setWeight(exId,nextLoadUp(exId)); }
    else if(a==="down"){ const vals=[...new Set(S.equipment.loads.map(l=>l.v))].sort((x,y)=>x-y);
      const prev=[...vals].reverse().find(v=>v<w); if(prev!=null&&w>0)setWeight(exId,prev); }
    else if(a==="swap"){ if(w>0){const vals=[...new Set(S.equipment.loads.map(l=>l.v))].sort((x,y)=>x-y);
      const prev=[...vals].reverse().find(v=>v<w); setWeight(exId,prev!=null?prev:0);} }
  }
}
async function aiAnalyze(plan){
  const sample=await cap("sample"); if(!sample)return null;
  const logs=[];
  plan.blocks.forEach(b=>b.items.forEach(it=>{
    logs.push({exercise:EX[it.exId].name,prescribed:it.sets+"x"+it.reps,weight:it.log.weightUsed,
      repsDone:it.log.repsDone,feel:it.log.feel||"not logged",pain:!!it.log.pain,notes:it.log.notes||""});
  }));
  const p=S.profile, hh=health();
  const prompt=[
    "You are a certified strength coach writing a short, warm, practical note to a client.",
    "Client: "+p.age+"y "+p.sex+", "+p.heightCm+"cm, "+p.weightKg+"kg, BMI "+hh.bmi.toFixed(1)+", goal ~"+p.targetKg+"kg (fat loss + strength).",
    "IMPORTANT constraints: patellar-tendon knee rehab (all knee work must stay pain-free, follow physio), and ankles that roll (needs stability work). Equipment: dumbbells + adjustable bench only.",
    "Today's session: "+plan.name+".",
    "Logged performance (JSON):",
    JSON.stringify(logs),
    "Write a 2-4 sentence coaching note: acknowledge today, and say clearly how tomorrow should change (progress, hold, or back off). If any pain was flagged, prioritise safety and mention the physio. Be specific and encouraging, no medical claims, no markdown."
  ].join("\n");
  try{
    const r=await sample(prompt,{modelTier:"default"});
    return (r&&r.text)?r.text.trim():null;
  }catch(e){ return null; }
}

/* ============ submit ============ */
async function submitDay(btn){
  const plan=S.plan;
  const ana=ruleAnalyze(plan);
  // record history
  const volumeByMuscle={}; const entries=[]; let feelSum=0,feelN=0;
  const feelScore={failed:1,hard:2,good:3,easy:4};
  plan.blocks.forEach(b=>b.items.forEach(it=>{
    const ex=EX[it.exId]; const w=parseFloat(it.log.weightUsed)||0; const reps=parseFloat(it.log.repsDone)||0;
    entries.push({exId:it.exId,name:ex.name,sets:it.sets,prescribed:it.reps,weightUsed:it.log.weightUsed||"",
      repsDone:it.log.repsDone||"",feel:it.log.feel||"",pain:!!it.log.pain,unit:(S.equipment.loads[0]||{}).u||"lb"});
    if(it.log.feel){feelSum+=feelScore[it.log.feel]||3;feelN++;}
    const vol=(w||1)*(reps||1)*it.sets;
    ex.primary.forEach(m=>{volumeByMuscle[m]=(volumeByMuscle[m]||0)+vol;});
  }));
  // AI note if enabled + available (falls back to rules)
  let coachNote=ana.note, aiUsed=false;
  if(S.profile.aiEnabled){
    if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> AI coach analysing…';}
    const ai=await aiAnalyze(plan);
    if(ai){coachNote=ai;aiUsed=true;}
  }
  // apply progression
  applyAdjustments(ana.adjustments);
  plan.submitted=true; plan.coachNote=coachNote; plan.aiUsed=aiUsed;
  S.history.unshift({date:plan.date,name:plan.name,focus:plan.focus,volumeByMuscle,entries,
    bodyweightKg:S.profile.weightKg,feelAvg:feelN?feelSum/feelN:null,coachNote,aiUsed});
  // advance cycle only for real training days
  if(!plan.isRecovery)S.cycle=(S.cycle+1)%4;
  // prepare tomorrow
  const tmr=new Date(); tmr.setDate(tmr.getDate()+1); const tstr=todayStr(tmr);
  const tIdx=isTrainingDay(tstr)?S.cycle%4:null;
  S.tomorrow=buildPlan(tstr,tIdx);
  S.tomorrow.coachNote=coachNote;
  save();
  render();
  toast(aiUsed?"Day submitted — AI planned tomorrow ✓":"Day submitted — tomorrow is ready ✓");
}

/* ============ CSV export / import ============ */
function buildCSV(){
  const rows=[["date","session","exercise","primary_muscle","sets","prescribed_reps","weight_used","unit","reps_done","feel","pain","bodyweight_kg","ai_used"]];
  S.history.forEach(h=>h.entries.forEach(e=>{
    rows.push([h.date,h.name,e.name,(EX[e.exId]?EX[e.exId].primary.join("|"):""),e.sets,e.prescribed,e.weightUsed,e.unit,e.repsDone,e.feel,e.pain?"yes":"no",h.bodyweightKg,h.aiUsed?"yes":"no"]);
  }));
  S.weightLog.forEach(w=>rows.push([w.date,"BODYWEIGHT","","",""," ","",""," ","","",w.kg,""]));
  return rows.map(r=>r.map(c=>{c=String(c==null?"":c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\n");
}
async function exportCSV(){
  const csv=buildCSV(); const fn="groundwork-history-"+todayStr()+".csv";
  const dl=await cap("downloads");
  if(dl){ try{ await dl.save({filename:fn,data:csv}); toast("Saved "+fn+" ✓"); return;}catch(e){} }
  // fallback for standalone (non-artifact) use
  try{const b=new Blob([csv],{type:"text/csv"});const u=URL.createObjectURL(b);const a=el("a",{href:u,download:fn});document.body.append(a);a.click();a.remove();URL.revokeObjectURL(u);toast("Downloaded "+fn);}
  catch(e){ toast("Export not available in this view."); }
}
function importCSV(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const lines=String(rd.result).split(/\r?\n/).filter(Boolean);
      const head=lines.shift().split(",");
      const idx=n=>head.indexOf(n);
      const byDate={};
      lines.forEach(line=>{
        const c=line.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(x=>x.replace(/,$/,"").replace(/^"|"$/g,"").replace(/""/g,'"'));
        const date=c[idx("date")], sess=c[idx("session")];
        if(sess==="BODYWEIGHT"){ const kg=parseFloat(c[idx("bodyweight_kg")]); if(kg)S.weightLog.push({date,kg}); return; }
        (byDate[date]=byDate[date]||{date,name:sess,focus:"",entries:[],volumeByMuscle:{},bodyweightKg:parseFloat(c[idx("bodyweight_kg")])||S.profile.weightKg,aiUsed:c[idx("ai_used")]==="yes"});
        byDate[date].entries.push({exId:"",name:c[idx("exercise")],sets:c[idx("sets")],prescribed:c[idx("prescribed_reps")],
          weightUsed:c[idx("weight_used")],unit:c[idx("unit")],repsDone:c[idx("reps_done")],feel:c[idx("feel")],pain:c[idx("pain")]==="yes"});
      });
      const imported=Object.values(byDate);
      if(imported.length){ S.history=imported.sort((a,b)=>b.date<a.date?-1:1).concat(S.history); }
      // dedupe weightLog by date
      const seen={}; S.weightLog=S.weightLog.filter(w=>seen[w.date]?false:(seen[w.date]=true));
      S.weightLog.sort((a,b)=>a.date<b.date?-1:1);
      save(); render(); toast("Imported "+imported.length+" session(s) ✓");
    }catch(e){ toast("Couldn't read that CSV — check the format."); }
  };
  rd.readAsText(file);
}

function sparkline(vals){
  const w=200,h=34,pad=3; if(!vals.length)return el("div",{class:"mini"},"—");
  const mx=Math.max(...vals),mn=Math.min(...vals),rng=(mx-mn)||1;
  const step=vals.length>1?(w-2*pad)/(vals.length-1):0;
  const pts=vals.map((val,i)=>[pad+i*step, h-pad-((val-mn)/rng)*(h-2*pad)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","spark");svg.setAttribute("viewBox","0 0 "+w+" "+h);svg.setAttribute("preserveAspectRatio","none");
  const area=document.createElementNS(svg.namespaceURI,"path");
  area.setAttribute("d",d+" L "+pts[pts.length-1][0].toFixed(1)+" "+h+" L "+pts[0][0].toFixed(1)+" "+h+" Z");
  area.setAttribute("fill","var(--accent-soft)");
  const line=document.createElementNS(svg.namespaceURI,"path");
  line.setAttribute("d",d);line.setAttribute("fill","none");line.setAttribute("stroke","var(--accent)");line.setAttribute("stroke-width","2");line.setAttribute("stroke-linejoin","round");
  const end=document.createElementNS(svg.namespaceURI,"circle");
  end.setAttribute("cx",pts[pts.length-1][0]);end.setAttribute("cy",pts[pts.length-1][1]);end.setAttribute("r","2.6");end.setAttribute("fill","var(--accent-strong)");
  svg.append(area,line,end);return svg;
}

  const next=cur? (cur==="dark"?"light":"dark") : (dark?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("gw_theme",next);}catch(e){}
});
try{const th=localStorage.getItem("gw_theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}

/* ============ boot ============ */
load(); render(); updateSyncUI(); initSync();
</script>
